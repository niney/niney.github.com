<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>niney pages</title>
  <meta name="description" content="niney가 만든 작은 웹 페이지 모음">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧭</text></svg>">
  <style>
    :root {
      --bg: #f7f6f3;
      --card: #ffffff;
      --text: #1f1f1f;
      --muted: #6b6b6b;
      --border: #e6e3dc;
      --accent: #e8590c;
      --shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.06);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #161616;
        --card: #212121;
        --text: #ededed;
        --muted: #a0a0a0;
        --border: #2f2f2f;
        --accent: #ff8a3d;
        --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", sans-serif;
      line-height: 1.6;
      display: flex;
      flex-direction: column;
    }
    main {
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      padding: 72px 16px 40px;
      flex: 1;
    }
    header h1 {
      margin: 0 0 8px;
      font-size: clamp(28px, 6vw, 40px);
      letter-spacing: -0.02em;
    }
    header p {
      margin: 0 0 40px;
      color: var(--muted);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 16px;
    }
    .card {
      display: flex;
      gap: 16px;
      align-items: flex-start;
      padding: 20px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: var(--shadow);
      color: inherit;
      text-decoration: none;
      transition: transform .15s ease, border-color .15s ease;
    }
    .card:hover, .card:focus-visible {
      transform: translateY(-2px);
      border-color: var(--accent);
      outline: none;
    }
    .icon {
      flex: none;
      font-size: 32px;
      line-height: 1;
    }
    .card h2 {
      margin: 0 0 4px;
      font-size: 18px;
    }
    .card p {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 14px;
    }
    .url {
      font-size: 12px;
      color: var(--accent);
      word-break: break-all;
    }
    footer {
      padding: 24px 16px;
      text-align: center;
      font-size: 13px;
      color: var(--muted);
    }
    footer a { color: inherit; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>niney pages</h1>
      <p>직접 만든 작은 웹 페이지들을 모아둔 곳입니다.</p>
    </header>

    <section class="grid">
      <a class="card" href="https://niney.github.io/niney-pages/">
        <span class="icon" aria-hidden="true">🎰</span>
        <div>
          <h2>음식 메뉴 룰렛</h2>
          <p>오늘 뭐 먹지? 룰렛을 돌려 메뉴와 맛집을 골라보세요.</p>
          <span class="url">/niney-pages</span>
        </div>
      </a>

      <a class="card" href="https://niney.github.io/foodict-page/">
        <span class="icon" aria-hidden="true">🍲</span>
        <div>
          <h2>요리 · 한식 레시피</h2>
          <p>매일 새로운 한식 레시피를 발견하세요.</p>
          <span class="url">/foodict-page</span>
        </div>
      </a>
    </section>
  </main>

  <footer>
    <a href="https://github.com/niney">github.com/niney</a>
  </footer>
</body>
</html>
